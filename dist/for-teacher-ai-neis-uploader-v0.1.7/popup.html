<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <title>NEIS Upload</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="shell">
      <header class="top">
        <div>
          <p class="eyebrow">ForTeacher AI</p>
          <h1>나이스 붙여넣기</h1>
        </div>
        <span id="accountBadge" class="badge neutral">미연결</span>
      </header>

      <section class="card account-card">
        <div class="card-head">
          <div>
            <h2>계정</h2>
            <p id="accountState">웹앱 계정을 연결하면 저장 데이터를 불러올 수 있습니다.</p>
          </div>
        </div>
        <div class="button-row">
          <button id="connectWebApp" type="button" class="button primary">웹앱 계정 연결</button>
          <button id="logoutWebApp" type="button" class="button ghost">로그아웃</button>
        </div>
      </section>

      <section class="card">
        <div class="card-head">
          <div>
            <h2>데이터 선택</h2>
            <p>저장한 작업로그를 고르거나 CSV를 불러오세요.</p>
          </div>
          <button id="resetData" type="button" class="button compact">초기화</button>
        </div>

        <div class="source-switch" role="radiogroup" aria-label="데이터 방식">
          <label>
            <input type="radio" name="sourceMode" value="web" checked />
            <span>웹앱 데이터</span>
          </label>
          <label>
            <input type="radio" name="sourceMode" value="csv" />
            <span>CSV</span>
          </label>
        </div>

        <div class="source-panel">
          <label class="label" for="category">나이스 입력 영역</label>
          <select id="category">
            <option value="behavior">행특</option>
            <option value="subject">학기말 종합의견</option>
            <option value="creative">창체</option>
          </select>
        </div>
        <div id="webSourcePanel" class="source-panel">
          <div class="log-toolbar">
            <label for="logState" class="label">작업로그</label>
            <button id="refreshLogs" type="button" class="button compact">목록 새로고침</button>
          </div>
          <select id="logState" aria-label="작업로그 상태">
            <option value="editable">저장본</option>
            <option value="archived">보관본 · 읽기 전용</option>
          </select>
          <label class="label log-label" for="workLog">가져올 작업로그</label>
          <select id="workLog" aria-describedby="logInfo"><option value="">저장된 작업로그 없음</option></select>
          <p id="logInfo" class="log-info">웹앱에서 작업로그에 저장한 결과를 선택하세요.</p>
          <div class="pagination">
            <button id="previousPage" type="button" class="button compact" disabled>이전</button>
            <span id="pageInfo">1 / 1쪽 · 0개</span>
            <button id="nextPage" type="button" class="button compact" disabled>다음</button>
          </div>
          <button id="loadWebData" type="button" class="button primary full" disabled>선택한 작업로그 불러오기</button>
        </div>

        <div id="csvSourcePanel" class="source-panel hidden">
          <label class="label" for="csvFile">CSV 파일</label>
          <input id="csvFile" type="file" accept=".csv,text/csv" />
          <button id="parseClipboard" type="button" class="button full">클립보드 CSV 읽기</button>
        </div>
      </section>

      <section class="card">
        <div class="card-head">
          <div>
            <h2>불러온 목록</h2>
            <p id="recordSummary">붙여넣을 학생 데이터를 확인하세요.</p>
          </div>
          <strong id="recordCount" class="count">0명</strong>
        </div>
        <div id="recordTable" class="record-table" aria-label="불러온 학생별 데이터"></div>
      </section>

      <section class="card settings-card">
        <div class="settings-grid">
          <label>
            <span class="label">입력 간격</span>
            <input id="delay" type="number" min="0" max="2000" step="50" value="300" />
          </label>
        </div>
      </section>

      <section class="actions">
        <button id="openOverlay" type="button" disabled class="button primary full action-button">나이스 화면에 패널 띄우기</button>
      </section>

      <p id="status" role="status"></p>
    </main>

    <script src="config.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
