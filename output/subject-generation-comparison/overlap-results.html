  <script>
    {
      const root = document.getElementById("subject-overlap-results");
      const records = JSON.parse(document.getElementById("subject-overlap-data").textContent);
      const select = document.getElementById("subject-overlap-student");
      const defaultId = Number(select.value);
      const level = root.querySelector("[data-level]");
      const note = root.querySelector("[data-note]");
      const reason = root.querySelector("[data-reason]");
      const status = root.querySelector("[data-status]");
      const before = root.querySelector('[data-text="before"]');
      const after = root.querySelector('[data-text="after"]');
      const labels = ["창작", "표현", "감상"];

      function renderSegments(element, segments) {
        element.replaceChildren(...segments.map(segment => {
          if (!segment.changed) return document.createTextNode(segment.text);
          const mark = document.createElement("mark");
          mark.textContent = segment.text;
          return mark;
        }));
      }

      function showStudent(rawId, announce) {
        const row = records.find(record => record.id === Number(rawId)) ?? records.find(record => record.id === defaultId);
        select.value = String(row.id);
        level.textContent = row.levels.map((value, index) => `${labels[index]} ${value || "미평가"}`).join(" · ");
        note.hidden = row.note === "없음";
        note.textContent = note.hidden ? "" : `개별 특이사항 · ${row.note}`;
        renderSegments(before, row.beforeSegments);
        renderSegments(after, row.afterSegments);
        reason.textContent = row.reason || "이 학생은 원문을 유지했어요.";
        if (announce) status.textContent = `${row.id}번 예시 학생의 비교 결과를 표시했습니다.`;
      }

      showStudent(window.openai?.widgetState?.modelContent?.studentId ?? defaultId, false);
      select.addEventListener("change", () => {
        showStudent(select.value, true);
        window.openai?.setWidgetState?.({ modelContent: { studentId: Number(select.value) } }).catch(() => {});
      });
      window.addEventListener("openai:set_globals", event => {
        const id = event.detail?.globals?.widgetState?.modelContent?.studentId;
        if (id !== undefined) showStudent(id, false);
      });
    }
  </script>
</section>
