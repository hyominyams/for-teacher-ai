 선택한 리듬이 노랫말에 어울리는 까닭을 설명함. 주어진 리듬을 연주할 때 일정한 빠르기를 유지하며 표현함. 서로 다른 가락의 소리를 비교해 듣고, 소리가 어울리는 부분을 찾아 그 특징을 설명함.ેણ","batch":"노랫말과 리듬을 연결하는 음악적 창의성이 돋보임. 노랫말의 흐름과 낱말의 강세를 살려 말붙임새를 만들고 구성 이유를 덧붙임. 주어진 리듬을 일정한 빠르기로 연주하며, 서로 다른 가락을 귀 기울여 듣고 소리가 어울리는 부분을 설명함.","bound":"말의 흐름과 강세를 리듬으로 살려 표현하는 음악적 창의성이 돋보임. 말붙임새를 구성한 까닭을 설명하고, 서로 다른 가락에서 소리가 어우러지는 부분을 비교해 짚어 냄. 주어진 리듬은 일정한 빠르기를 유지하며 연주해 안정된 흐름을 들려줌."},{"id":9,"levels":["상","하","중"],"note":"자신의 연주를 녹음하고 되들으며 일정한 빠르기를 점검함.","individual":"소리와 말의 관계를 생각하며 음악적 아이디어를 만드는 창의성이 돋보임. 노랫말의 흐름과 낱말의 강세를 고려해 말붙임새를 구성하고, 그렇게 표현한 까닭을 설명함. 손뼉 박에 맞춰 기본 리듬을 연주하는 과정에서 자신의 연주를 녹음해 되들으며 빠르기를 점검함. 두 가락을 귀 기울여 듣고 소리가 어울리는 부분을 찾아 악곡의 특징을 살펴봄.","batch":"노랫말의 흐름을 살려 말붙임새를 만드는 음악적 창의성이 돋보임. 낱말의 강세를 고려해 말붙임새를 구성하고 까닭을 설명함. 연주를 녹음해 다시 들으며 빠르기를 점검하고, 제시된 구간을 다시 들으며 들리는 가락을 구분하는 연습을 이어감.","bound":"노랫말의 흐름과 낱말의 강세를 반영해 말붙임새를 구성하는 역량이 돋보임. 선택한 리듬의 구성 이유를 설명함. 제시된 손뼉 박에 맞추어 기본 리듬을 따라 연주하며, 자신의 연주를 녹음해 다시 들으면서 일정한 빠르기를 점검함. 두 가락을 주의 깊게 듣고 소리가 어울리는 부분을 찾아냄."},{"id":10,"levels":["상","상","중"],"note":"없음","individual":"음악적 창의성이 돋보임. 노랫말의 흐름과 낱말의 강세를 살펴 리듬에 어울리는 말붙임새를 만들고, 구성한 까닭을 설명함. 일정한 박과 빠르기를 유지하며 강약의 변화를 분명히 살려 리듬을 표현함. 두 가락을 귀 기울여 듣고 소리가 어울리는 부분을 찾아냄.","batch":"음악적 표현력이 돋보임. 노랫말의 흐름과 낱말의 강세에 어울리는 말붙임새를 구성하고 그 이유를 설명함. 일정한 박과 빠르기 속에서 강약을 분명히 살려 리듬을 표현하며, 두 가락을 주의 깊게 듣고 소리가 어울리는 부분을 찾아냄.","bound":"노랫말에 어울리는 리듬을 구상하고 그 까닭을 설명하는 창의성이 돋보임. 낱말의 강세와 흐름을 고려해 말붙임새를 구성함. 일정한 박과 빠르기를 지키면서 강약을 분명하게 살려 리듬을 표현함. 두 가락을 귀 기울여 듣고 서로의 소리가 어우러지는 부분을 찾아 설명함."},{"id":11,"levels":["중","상","상"],"note":"없음","individual":"음악적 표현력이 돋보임. 일정한 박과 빠르기를 유지하며 강약의 변화를 분명히 살려 리듬을 표현함. 서로 다른 가락을 비교해 듣고 소리가 어울리는 부분의 특징을 설명함. 노랫말의 흐름을 살펴 말붙임새를 구성하며 가사와 리듬의 관계를 표현에 반영함.","batch":"음악적 표현력이 돋보임. 노랫말의 흐름을 따라 말붙임새를 구성함. 박과 빠르기를 안정적으로 유지하며 강약의 변화를 분명히 표현하고, 서로 다른 가락을 비교해 소리의 어울림이 드러나는 부분을 설명함.","bound":"박과 빠르기를 안정적으로 지키며 강약의 차이를 살려 연주하는 표현력이 돋보임. 노랫말의 흐름을 따라 말붙임새를 구성하고, 서로 다른 가락을 비교해 소리의 어울림이 나타나는 부분을 설명함. 리듬과 가락의 특징을 듣고 살피며 음악적 표현과 감상을 고르게 보여 줌."},{"id":12,"levels":["중","상","중"],"note":"쉼표가 있는 구간에서 박의 흐름을 놓치지 않도록 반복해 연습함.","individual":"일정한 박과 빠르기를 바탕으로 강약을 살려 음악적 표현력을 발휘함. 리듬을 표현할 때 박과 빠르기의 흐름을 유지하고 강약의 변화를 분명히 드러내며, 쉼표가 있는 부분에서도 박을 놓치지 않도록 반복해 연습함. 노랫말의 흐름을 살펴 말붙임새를 구성하고, 두 가락을 귀 기울여 들으며 소리가 어울리는 부분을 찾아봄.","batch":"음악적 표현력이 두드러짐. 노랫말의 흐름에 맞게 말붙임새를 만들고, 쉼표가 있는 구간에서도 박의 흐름을 놓치지 않도록 반복해 연습함. 일정한 박과 빠르기 위에 강약을 살려 연주하며, 두 가락을 듣고 소리가 어울리는 부분을 찾음.","bound":"리듬의 강약을 분명히 표현하며 박의 흐름을 안정적으로 이어 가는 힘이 돋보임. 쉼표가 있는 구간에서도 박을 놓치지 않도록 반복해 연습함. 노랫말의 흐름에 맞게 말붙임새를 구성하고, 두 가락을 들으며 소리가 어울리는 부분을 찾아냄."},{"id":13,"levels":["중","중","중"],"note":"없음","individual":"음악적 표현력이 안정적임. 노랫말의 흐름을 살펴 말붙임새를 구성하고, 가사와 리듬이 자연스럽게 이어지도록 표현함. 주어진 리듬을 연주할 때 일정한 빠르기를 유지하며, 여러 가락을 귀 기울여 들은 뒤 두 가락의 소리가 어울리는 부분을 찾아 설명함. 익힌 표현 방법과 감상 경험을 바탕으로 음악의 특징을 꾸준히 살펴 가는 모습이 돋보임.","batch":"노랫말과 리듬의 관계를 익혀 음악적으로 표현함. 노랫말의 흐름에 맞추어 말붙임새를 구성함. 일정한 빠르기를 지켜 주어진 리듬을 연주하고, 두 가락을 귀 기울여 들으며 소리가 어울리는 부분을 찾아냄.","bound":"노랫말의 흐름과 가락의 어울림을 듣고 살피는 음악적 감수성이 돋보임. 말의 흐름에 맞게 말붙임새를 만들고, 주어진 리듬은 일정한 빠르기로 연주함. 두 가락을 귀 기울여 비교하며 소리가 어우러지는 부분을 찾아 음악의 특징을 파악함."},{"id":14,"levels":["중","중","중"],"note":"없음","individual":"가락의 어울림과 리듬의 흐름을 살피며 음악적 요소를 듣고 표현하는 힘이 안정적임. 노랫말의 흐름에 맞춰 말붙임새를 구성하고, 일정한 빠르기를 유지하며 주어진 리듬을 연주함. 두 가락을 귀 기울여 들으며 소리가 어울리는 부분을 찾아 음악의 특징을 살피는 모습이 돋보임.","batch":"주어진 음악 활동에서 각 요소를 충실히 표현함. 노랫말의 흐름에 맞게 말붙임새를 만들고, 일정한 빠르기를 유지하여 주어진 리듬을 연주함. 두 가락을 주의 깊게 듣고 소리가 어울리는 부분을 찾아 악곡의 특징을 살펴봄.","bound":"노랫말의 흐름을 리듬에 반영하고 소리의 어울림을 찾아내는 힘을 보임. 말의 흐름에 맞게 말붙임새를 구성했으며, 주어진 리듬은 일정한 빠르기를 유지해 연주함. 두 가락을 주의 깊게 듣고 어울리는 부분을 찾아 악곡의 특징을 살펴봄."},{"id":15,"levels":["중","중","중"],"note":"없음","individual":"노랫말과 소리의 특징을 살펴 음악적 표현에 반영하는 힘을 기르고 있음. 노랫말의 흐름을 고려해 말붙임새를 구성하고, 주어진 리듬을 연주할 때 일정한 빠르기를 유지함. 두 가락을 귀 기울여 들으며 소리가 어울리는 부분을 찾아 악곡의 특징을 살펴보는 등 음악의 흐름과 어울림을 이해해 가고 있음.","batch":"노랫말의 흐름을 리듬에 연결하여 표현함. 말붙임새를 노랫말의 흐름에 맞게 구성하고, 주어진 리듬은 일정한 빠르기로 연주함. 두 가락을 귀 기울여 들으며 소리가 어울리는 부분을 찾아 가락의 특징을 파악함.","bound":"주어진 리듬을 일정한 빠르기로 이어 연주하고 가락의 어울림을 듣는 능력을 보임. 노랫말의 흐름에 어울리도록 말붙임새를 구성함. 두 가락을 귀 기울여 비교해 소리가 함께 어우러지는 부분을 찾으며 감상 내용을 구체화함."},{"id":16,"levels":["중","하","중"],"note":"없음","individual":"음악적 창의성이 안정적으로 드러남. 노랫말의 흐름을 살펴 말붙임새를 구성하며 가사와 리듬의 관계를 표현함. 제시된 손뼉 박에 맞추어 기본 리듬을 따라 연주하며 일정한 박과 빠르기를 익혀 가고 있음. 두 가락을 주의 깊게 듣고 소리가 어울리는 부분을 찾아 악곡의 특징을 살펴봄.","batch":"노랫말의 흐름에 어울리게 말붙임새를 구성함. 주어진 리듬을 연주할 때 제시된 손뼉 박에 맞추어 기본 리듬을 따라 표현함. 두 가락을 주의 깊게 듣고 소리가 어울리는 부분을 찾아내며, 박을 유지하는 연습을 이어감.","bound":"노랫말의 흐름을 고려해 말붙임새를 구성하고 가락의 어울림을 살피는 힘을 보임. 두 가락을 듣고 소리가 어우러지는 부분을 찾아냄. 리듬 연주에서는 제시된 손뼉 박을 따라 기본 리듬을 표현하며 박과 빠르기를 익혀 가고 있어, 꾸준한 연습을 통해 표현을 넓혀 갈 수 있음."},{"id":17,"levels":["중","중",null],"note":"제시된 노랫말의 핵심 낱말에 손뼉으로 박을 짚어 봄.","individual":"노랫말과 리듬의 관계를 살펴 음악적 표현으로 옮기는 힘을 보임. 제시된 노랫말에서 핵심 낱말을 손뼉으로 짚어 보며 말의 흐름에 어울리는 말붙임새를 구성함. 주어진 리듬을 연주할 때 일정한 빠르기를 유지하며 박의 흐름을 따라 표현함.","batch":"노랫말의 흐름에 맞추어 말붙임새를 구성함. 핵심 낱말에 손뼉으로 박을 짚어 보며 노랫말과 리듬의 관계를 살펴봄. 주어진 리듬은 일정한 빠르기로 연주하고, 두 가락을 듣고 소리가 어울리는 부분을 찾음.","bound":"노랫말의 흐름을 살펴 리듬에 맞게 말붙임새를 구성하는 능력을 보임. 제시된 노랫말의 핵심 낱말에 손뼉으로 박을 짚어 보며 말과 리듬의 관계를 확인함. 주어진 리듬을 일정한 빠르기로 연주해 박의 흐름을 유지함."},{"id":18,"levels":["하","중","상"],"note":"없음","individual":"소리의 어울림을 살펴 악곡의 특징을 설명하는 음악적 감수성이 돋보임. 서로 다른 가락을 비교하고, 소리가 조화롭게 어우러지는 부분을 짚어 설명함. 주어진 리듬을 연주할 때 일정한 빠르기를 유지하며 표현하고, 노랫말과 박의 관계는 제시된 말붙임새를 따라 하며 익혀 가는 중임.","batch":"가락의 특징을 듣고 살피는 음악적 감수성이 돋보임. 제시된 말붙임새를 따라 하며 노랫말과 박의 관계를 익히고, 주어진 리듬은 일정한 빠르기로 연주함. 서로 다른 가락을 비교해 소리가 어울리는 부분을 찾아 설명함.","bound":"서로 다른 가락을 비교해 소리의 어울림을 설명하는 감수성이 돋보임. 말붙임새는 제시된 형태를 따라 하며 노랫말과 박의 관계를 익혀 가고 있음. 주어진 리듬을 일정한 빠르기로 연주하며, 창작 활동에서도 말의 흐름을 살펴 표현하는 경험을 쌓아 가고 있음."},{"id":19,"levels":["하","중","중"],"note":"없음","individual":"일정한 빠르기에 맞추어 리듬을 표현하는 음악적 표현력이 안정적임. 주어진 리듬을 연주할 때 빠르기를 일정하게 유지하며 박의 흐름을 살려 표현함. 두 가락을 주의 깊게 듣고 소리가 서로 어울리는 부분을 찾아 악곡의 특징을 살펴봄. 말붙임새를 익히는 과정에서는 제시된 형태를 따라 하며 노랫말과 박의 관계를 알아가고 있어, 반복하여 익히며 말붙임새를 구성하는 힘을 키워 갈 수 있음.","batch":"주어진 리듬을 일정한 빠르기로 표현함. 노랫말에 맞는 말붙임새는 제시된 예를 따라 하며 노랫말과 박의 관계를 익혀 가는 중임. 두 가락을 귀 기울여 듣고 소리가 어울리는 부분을 찾아 가락의 특징을 살펴봄.","bound":"주어진 리듬의 빠르기를 유지해 연주하고 가락의 어울림을 찾아 듣는 능력을 보임. 창작 활동에서는 제시된 말붙임새를 따라 하며 노랫말과 박의 관계를 익히는 중임. 두 가락을 귀 기울여 듣고 소리가 함께 어우러지는 부분을 찾아 감상함."},{"id":20,"levels":["하","하","중"],"note":"함께 연주할 때 제시된 시작 신호를 확인하고 연주를 시작함.","individual":"소리의 어울림을 살피는 음악적 감수성이 드러남. 두 가락을 귀 기울여 듣고 소리가 어울리는 부분을 찾아 악곡의 특징을 알아가며, 제시된 말붙임새를 따라 하면서 노랫말과 박의 관계를 익히는 중임. 손뼉 박에 맞추어 기본 리듬을 따라 연주하고, 함께 연주할 때는 제시된 시작 신호를 확인한 뒤 연주를 시작함.","batch":"두 가락의 어울림을 듣고 찾는 음악적 감수성을 보임. 제시된 말붙임새를 따라 하며 노랫말과 박의 관계를 익히고, 함께 연주할 때 시작 신호를 확인한 뒤 연주를 시작함. 주어진 리듬을 손뼉 박에 맞추어 표현하며 기본 박을 익혀 가고 있음.","bound":"두 가락을 주의 깊게 듣고 소리가 어울리는 부분을 찾아내는 힘을 보임. 말붙임새를 따라 하며 노랫말과 박의 관계를 익히고, 제시된 손뼉 박에 맞추어 기본 리듬을 연주함. 함께 연주할 때 시작 신호를 확인한 뒤 연주를 시작하는 등 합주의 흐름을 살피려는 모습을 보임."},{"id":21,"levels":["하","하","하"],"note":"없음","individual":"기본적인 음악적 표현의 바탕을 익혀 가고 있음. 말붙임새를 따라 해 보며 노랫말과 박이 어떻게 어울리는지 알아가는 중임. 손뼉 박에 맞추어 기본 리듬을 연주하며 일정한 박과 빠르기를 유지하는 연습을 함. 악곡의 일부를 다시 들으며 들리는 가락을 구분하고 특징을 알아보는 경험을 쌓아 가고 있음.","batch":"노랫말과 박의 관계를 익혀 가는 중임. 제시된 말붙임새를 따라 하며 노랫말에 리듬을 붙이는 방법을 살펴봄. 손뼉 박에 맞추어 기본 리듬을 연주하고, 제시된 구간을 다시 들으며 들리는 가락을 구분하는 연습을 이어감.","bound":"노랫말과 박의 관계를 익히며 기본 리듬과 가락을 구분하는 경험을 쌓고 있음. 제시된 말붙임새를 따라 하며 말과 박의 연결을 살피고, 손뼉 박에 맞추어 기본 리듬을 표현함. 감상에서는 제시된 구간을 다시 들으며 들리는 가락을 구분하는 연습을 이어 가고 있음."},{"id":22,"levels":["하","하","하"],"note":"없음","individual":"음악적 표현의 기초를 차근차근 익혀 가고 있음. 노랫말의 흐름과 박의 관계를 알아가는 과정에서 제시된 말붙임새를 따라 하며 리듬을 익힘. 손뼉으로 제시된 박에 맞추어 기본 리듬을 따라 연주하며 일정한 박을 표현하는 연습을 함. 여러 가락의 소리를 구분하기 위해 제시된 구간을 다시 들으며 들리는 가락을 살펴봄. 익힌 내용을 바탕으로 말붙임새와 리듬 표현, 가락 구분 능력을 꾸준히 발전시켜 갈 수 있음.","batch":"기본 리듬과 가락을 차근차근 익혀 가고 있음. 제시된 말붙임새를 따라 하며 노랫말과 박의 관계를 살펴보고, 손뼉 박에 맞추어 기본 리듬을 표현함. 음악을 다시 들으며 구간에 나타나는 가락을 구분하는 연습을 지속함.","bound":"기본적인 리듬과 가락을 익히며 음악의 흐름을 파악해 가고 있음. 제시된 말붙임새를 따라 하며 노랫말과 박의 관계를 경험하고, 손뼉 박에 맞추어 기본 리듬을 연주함. 가락 감상에서는 구간을 다시 들으며 들리는 소리를 구분하는 연습을 꾸준히 이어 갈 필요가 있음."},{"id":23,"levels":["하","하",null],"note":"없음","individual":"노랫말과 박의 관계를 익히고 리듬을 소리로 표현하는 기초를 다져 가고 있음. 제시된 말붙임새를 따라 하며 노랫말의 흐름과 박이 어떻게 어울리는지 익히고, 손뼉으로 제시되는 박에 맞추어 기본 리듬을 연주함. 일정한 박과 빠르기를 유지하는 경험을 쌓으며 말과 리듬을 연결해 표현하는 힘을 키워 가고 있음.","batch":"노랫말의 흐름에 맞는 말붙임새를 익혀 가는 중임. 제시된 말붙임새를 따라 하며 노랫말과 박의 관계를 살펴봄. 손뼉 박에 맞추어 기본 리듬을 연주하며 박의 흐름에 맞춰 표현하는 연습을 이어감.","bound":"말과 박의 관계를 익히고 기본 리듬을 따라 표현하는 기초를 다져 가고 있음. 제시된 말붙임새를 따라 하며 노랫말과 박의 연결을 살펴보고, 손뼉 박에 맞추어 기본 리듬을 연주함. 반복해 듣고 박의 흐름을 확인하는 경험을 쌓으면 음악적 표현을 차츰 넓혀 갈 수 있음."}]</script>
  <script>
    {
      const root = document.getElementById("subject-generation-results");
      const records = JSON.parse(document.getElementById("subject-results-data").textContent);
      const select = document.getElementById("subject-results-student");
      const level = root.querySelector("[data-level]");
      const note = root.querySelector("[data-note]");
      const annotation = root.querySelector("[data-annotation]");
      const status = root.querySelector("[data-status]");
      const fields = [...root.querySelectorAll("[data-text]")];
      const flaggedPhrase = "두 가락을 듣고 소리가 어울리는 부분을 찾음.";
      const labels = ["창작", "표현", "감상"];

      function showStudent(rawId, announce) {
        const id = Number(rawId);
        const row = records.find(record => record.id === id) ?? records[16];
        select.value = String(row.id);
        level.textContent = row.levels.map((value, index) => `${labels[index]} ${value || "미평가"}`).join(" · ");
        note.hidden = row.note === "없음";
        note.textContent = note.hidden ? "" : `개별 특이사항 · ${row.note}`;
        annotation.hidden = row.id !== 17;
        for (const field of fields) {
          const key = field.dataset.text;
          const text = row[key];
          const match = row.id === 17 && key === "batch" ? text.indexOf(flaggedPhrase) : -1;
          if (match === -1) {
            field.textContent = text;
          } else {
            const marked = document.createElement("mark");
            marked.textContent = flaggedPhrase;
            field.replaceChildren(text.slice(0, match), marked, text.slice(match + flaggedPhrase.length));
          }
        }
        if (announce) status.textContent = `${row.id}번 예시 학생의 세 가지 생성 결과를 표시했습니다.`;
      }

      showStudent(window.openai?.widgetState?.modelContent?.studentId ?? 17, false);
      select.addEventListener("change", () => {
        showStudent(select.value, true);
        window.openai?.setWidgetState?.({ modelContent: { studentId: Number(select.value) } }).catch(() => {});
      });
      window.addEventListener("openai:set_globals", event => {
        const id = event.detail?.globals?.widgetState?.modelContent?.studentId;
        if (id !== undefined) showStudent(id, false);
      });
    }
  </script>
